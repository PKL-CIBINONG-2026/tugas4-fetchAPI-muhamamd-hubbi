<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <!-- Load the Mock API SDK before app.js -->
    <script
      type="module"
      src="https://pkl-cibinong-2026.github.io/mock-api/client.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.12/dist/css/intlTelInput.css">

  </head>
  <body>
    <div id="app">
      <h1>User Management</h1>
      <button id="add-user" type="button">Add User</button>
      <div class="view-toggle">
        <button id="table-view-button" type="button" class="active">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 32 32"
          >
            <path d="M0 0h32v32H0z" fill="none" />
            <path
              fill="currentColor"
              d="M27 2H5c-1.1 0-2 .9-2 2v24c0 1.1.9 2 2 2h22c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2m0 10h-6V6h6zm0 8h-6v-6h6zM5 6h6v6H5zm14 0v6h-6V6zM5 14h6v6H5zm8 0h6v6h-6zm-8 8h6v6H5zm8 0h6v6h-6zm14 6h-6v-6h6z"
            />
          </svg>
        </button>
        <button id="grid-view-button" type="button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 36 36"
          >
            <path d="M0 0h36v36H0z" fill="none" />
            <path
              fill="currentColor"
              d="M14 4H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2M6 14V6h8v8Z"
              class="clr-i-outline clr-i-outline-path-1"
            />
            <path
              fill="currentColor"
              d="M30 4h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m-8 10V6h8v8Z"
              class="clr-i-outline clr-i-outline-path-2"
            />
            <path
              fill="currentColor"
              d="M14 20H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2M6 30v-8h8v8Z"
              class="clr-i-outline clr-i-outline-path-3"
            />
            <path
              fill="currentColor"
              d="M30 20h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2m-8 10v-8h8v8Z"
              class="clr-i-outline clr-i-outline-path-4"
            />
            <path fill="none" d="M0 0h36v36H0z" />
          </svg>
        </button>
      </div>
      <label class="search-box" for="user-search">
        <input id="user-search" type="search" placeholder="Search by name" autocomplete="off">
      </label>
      <div class="table-wrapper" id="table-view">
        <table id="user-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Full Name</th>
              <th scope="col">Email</th>
              <th scope="col">Phone</th>
              <th scope="col">Bio</th>
              <th scope="col">Address</th>
              <th scope="col">Avatar</th>
              <th scope="col">Theme</th>
              <th scope="col">2FA</th>
              <th scope="col">Email Notifications</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="user-container"></tbody>
        </table>
      </div>
      <section id="grid-view" class="user-grid" hidden></section>
      <nav id="pagination" class="pagination" aria-label="Pagination">
        <button type="button" data-action="prev" aria-label="Previous page" title="Previous page">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="0.75em"
            height="1em"
            viewBox="0 0 384 512"
          >
            <path d="M0 0h384v512H0z" fill="none" />
            <path
              fill="currentColor"
              d="M380.6 81.7c7.9 15.8 1.5 35-14.3 42.9L103.6 256l262.7 131.4c15.8 7.9 22.2 27.1 14.3 42.9s-27.1 22.2-42.9 14.3l-320-160C6.8 279.2 0 268.1 0 256s6.8-23.2 17.7-28.6l320-160c15.8-7.9 35-1.5 42.9 14.3"
            />
          </svg>
        </button>
        <div id="pagination-page" class="pagination-info">Page 1</div>
        <button type="button" data-action="next" aria-label="Next page" title="Next page">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="0.75em"
            height="1em"
            viewBox="0 0 384 512"
          >
            <path d="M0 0h384v512H0z" fill="none" />
            <path
              fill="currentColor"
              d="M3.4 81.7c-7.9 15.8-1.5 35 14.3 42.9L280.5 256L17.7 387.4c-15.8 7.9-22.2 27.1-14.3 42.9s27.1 22.2 42.9 14.3l320-160c10.8-5.4 17.7-16.5 17.7-28.6s-6.8-23.2-17.7-28.6l-320-160c-15.8-7.9-35-1.5-42.9 14.3"
            />
          </svg>
        </button>
      </nav>
      <dialog id="create-dialog">
        <form id="create-form">
          <h2 id="form-title">Add User</h2>
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" minlength="2" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" required />
          <div class="form-actions">
            <button id="cancel-form" type="button">Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </dialog>
      <dialog id="edit-dialog">
        <form id="edit-form">
          <h2 id="edit-form-title">Edit User</h2>
          <label for="edit-fullName">Full name</label>
          <input id="edit-fullName" name="fullName" minlength="2" required />
          <label for="edit-email">Email</label>
          <input id="edit-email" name="email" type="email" required />
          <label for="edit-phone">Phone</label>
          <input id="edit-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required />
          <label for="edit-bio">Bio</label>
          <input id="edit-bio" name="bio" required />
          <label for="edit-address">Address</label>
          <input id="edit-address" name="address" />
          <fieldset class="avatar-options">
            <legend>Avatar source</legend>
            <label><input type="radio" name="avatarMode" value="url" checked /> Use link</label>
            <label><input type="radio" name="avatarMode" value="upload" /> Upload image</label>
          </fieldset>
          <label data-avatar-url for="edit-avatarUrl">Avatar URL</label>
          <input id="edit-avatarUrl" data-avatar-url name="avatarUrl" type="url" />
          <label data-avatar-file for="edit-avatarFile" hidden>Choose image</label>
          <input id="edit-avatarFile" data-avatar-file name="avatarFile" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
          <img id="edit-avatar-preview" class="avatar-form-preview" alt="Avatar preview" hidden />
          <div class="form-actions">
            <button id="cancel-edit-form" type="button">Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </dialog>
    </div>
    <script type="module" src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.12/dist/js/intlTelInput.min.js"></script>

  </body>
</html>
